<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Рендер фарфоровых фигур</title>
<style>body{margin:0;background:#111;color:#ddd;font:14px system-ui}#log{padding:12px;white-space:pre}</style></head>
<body><div id="log">Рендер…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const log=s=>{document.getElementById('log').textContent+='\n'+s;};
const W=1800, H=800, SS=2;
const C=h=>new THREE.Color(h).convertSRGBToLinear();
const PI=Math.PI;

const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1); renderer.setSize(W*SS,H*SS,false);
renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.physicallyCorrectLights=false;

// студийное окружение: тёмная комната, софтбоксы
function studioEnv(){
  const env=new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.SphereGeometry(30,32,16),new THREE.MeshBasicMaterial({color:C('#0b0c0f'),side:THREE.BackSide})));
  const box=(w,h,pos,look,col)=>{ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:col,side:THREE.DoubleSide})); m.position.set(...pos); m.lookAt(...look); env.add(m); };
  box(14,8,[0,16,4],[0,0,0],new THREE.Color(5,5,5));       // большой верхний софтбокс
  box(3,14,[-14,6,6],[0,1,0],new THREE.Color(3,3.1,3.3));   // левый стрип
  box(3,14,[14,6,6],[0,1,0],new THREE.Color(3,3.1,3.3));    // правый стрип
  box(10,3,[0,4,-16],[0,1,0],new THREE.Color(1.6,1.6,1.7)); // задний контровой
  box(10,4,[0,2,16],[0,1,0],new THREE.Color(.5,.5,.52));    // слабый фронтальный
  const pm=new THREE.PMREMGenerator(renderer); const t=pm.fromScene(env,.02).texture; pm.dispose(); return t;
}
const ENV=studioEnv();

const PORCELAIN=new THREE.MeshPhysicalMaterial({color:C('#eeebe4'),roughness:.38,metalness:0,clearcoat:1,clearcoatRoughness:.06,vertexColors:true,envMapIntensity:1.25});

async function loadBin(url){
  const buf=await (await fetch(url)).arrayBuffer(); const u=new Uint32Array(buf,0,2); const nv=u[0], ni=u[1]; let o=8;
  const pos=new Float32Array(buf,o,nv*3); o+=nv*12; const nor=new Float32Array(buf,o,nv*3); o+=nv*12; const ao=new Float32Array(buf,o,nv); o+=nv*4; const idx=new Uint32Array(buf,o,ni);
  const col=new Float32Array(nv*3); for(let i=0;i<nv;i++){ const a=Math.pow(ao[i],1.7)*.88+.12; col[3*i]=col[3*i+1]=col[3*i+2]=a; }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setAttribute('normal',new THREE.BufferAttribute(nor,3)); g.setAttribute('color',new THREE.BufferAttribute(col,3)); g.setIndex(new THREE.BufferAttribute(idx,1));
  return g;
}

const SETS=[
  {key:'AT', file:'ref-1-adventure-time.png', title:'ВРЕМЯ ПРИКЛЮЧЕНИЙ', names:['Банановый страж','Джейк','Финн','БиМО','Принцесса Бубльгум','Ледяной король']},
  {key:'RM', file:'ref-2-rick-and-morty.png', title:'РИК И МОРТИ', names:['Морти','Птичья личность','Мистер Мисикс','Огурчик Рик','Саммер','Рик']},
  {key:'SB', file:'ref-3-spongebob.png', title:'ГУБКА БОБ', names:['Губка Боб','Морской конёк','Сквидвард','Дом-ананас','Сэнди','Царь Нептун']},
];
const ROLE=['ПЕШКА','КОНЬ','СЛОН','ЛАДЬЯ','ФЕРЗЬ','КОРОЛЬ'];
const KEYS=['p','n','b','r','q','k'];

function bgTexture(){ const c=document.createElement('canvas'); c.width=1024; c.height=512; const g=c.getContext('2d');
  const gr=g.createRadialGradient(512,220,40,512,260,700); gr.addColorStop(0,'#2a2c31'); gr.addColorStop(.55,'#141519'); gr.addColorStop(1,'#060708');
  g.fillStyle=gr; g.fillRect(0,0,1024,512); const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; return t; }

async function renderSet(set){
  const scene=new THREE.Scene(); scene.background=C('#08090b'); scene.environment=ENV;
  scene.fog=new THREE.Fog(C('#08090b'),8,16);
  // бесшовный студийный фон (циклорама)
  const prof=[]; for(let i=0;i<=40;i++){ const t=i/40; if(t<.5){ prof.push([9-t*2*10.5, 0]); } else { const a=(t-.5)*2*PI/2; prof.push([-1.5-Math.sin(a)*4, (1-Math.cos(a))*4]); } }
  prof.push([-5.5,14]);
  const cp=[], ci=[], XS=24;
  prof.forEach(([zz,yy],r)=>{ for(let c=0;c<=XS;c++) cp.push(-22+44*c/XS, yy, zz); });
  for(let r=0;r<prof.length-1;r++) for(let c=0;c<XS;c++){ const a=r*(XS+1)+c, b=a+XS+1; ci.push(a,b,a+1, a+1,b,b+1); }
  const cg=new THREE.BufferGeometry(); cg.setAttribute('position',new THREE.Float32BufferAttribute(cp,3)); cg.setIndex(ci); cg.computeVertexNormals();
  const cyc=new THREE.Mesh(cg,new THREE.MeshStandardMaterial({color:C('#1c1d21'),roughness:.55,metalness:0,envMapIntensity:.25,side:THREE.DoubleSide}));
  cyc.receiveShadow=true; scene.add(cyc);
  scene.add(new THREE.HemisphereLight(C('#cdd6e6'),C('#0c0d10'),.12));
  const key=new THREE.SpotLight(0xffffff,2.8,40,PI/7,.7,1.0); key.position.set(-4.2,7.5,6.5); key.target.position.set(0,.5,0); scene.add(key.target);
  key.castShadow=true; key.shadow.mapSize.set(4096,4096); key.shadow.bias=-.00008; key.shadow.normalBias=.01; key.shadow.radius=8; scene.add(key);
  const rimL=new THREE.DirectionalLight(C('#e3ebff'),1.5); rimL.position.set(-6,3.5,-6); scene.add(rimL);
  const rimR=new THREE.DirectionalLight(C('#e3ebff'),1.35); rimR.position.set(6,3.5,-5); scene.add(rimR);
  const fill=new THREE.DirectionalLight(0xffffff,.12); fill.position.set(5,2,6); scene.add(fill);
  const glow=new THREE.SpotLight(C('#9fb3d6'),1.2,30,PI/5,1,1); glow.position.set(0,6,-2); glow.target.position.set(0,0,-5); scene.add(glow.target); scene.add(glow);

  const xs=[-2.65,-1.59,-.53,.53,1.59,2.65];
  for(let i=0;i<6;i++){
    const g=await loadBin(`out/${set.key}-${KEYS[i]}.bin?${Date.now()}`);
    const m=new THREE.Mesh(g,PORCELAIN); m.castShadow=true; m.receiveShadow=true;
    m.position.set(xs[i],0,0); m.rotation.y = KEYS[i]==='n' ? .95 : (i-2.5)*-.06;
    scene.add(m);
  }
  const cam=new THREE.PerspectiveCamera(27,W/H,.1,100); cam.position.set(0,1.2,5.75); cam.lookAt(0,.58,0);
  renderer.render(scene,cam);

  const out=document.createElement('canvas'); out.width=W; out.height=H; const g2=out.getContext('2d');
  g2.imageSmoothingQuality='high'; g2.drawImage(renderer.domElement,0,0,W,H);
  // виньетка
  const vg=g2.createRadialGradient(W/2,H*.45,H*.35,W/2,H*.5,W*.62); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.55)'); g2.fillStyle=vg; g2.fillRect(0,0,W,H);
  g2.fillStyle='#e9e6df'; g2.textBaseline='top'; g2.textAlign='left';
  g2.letterSpacing='10px'; g2.font='400 34px Georgia, "Times New Roman", serif'; g2.fillText(set.title,64,54);
  g2.letterSpacing='4px'; g2.globalAlpha=.55; g2.font='400 15px "Segoe UI", system-ui, sans-serif'; g2.fillText('КОЛЛЕКЦИОННЫЕ ШАХМАТЫ · ГЛАЗУРОВАННЫЙ ФАРФОР',66,104); g2.globalAlpha=1;
  g2.fillStyle='rgba(233,230,223,.35)'; g2.fillRect(64,136,120,1);
  g2.textAlign='center';
  for(let i=0;i<6;i++){
    const px=new THREE.Vector3(xs[i],0,0).project(cam), py=new THREE.Vector3(xs[i],0,.42).project(cam);
    const x=(px.x+1)/2*W, y=(1-py.y)/2*H+22;
    g2.fillStyle='#e9e6df'; g2.globalAlpha=.5; g2.letterSpacing='4px'; g2.font='600 13px "Segoe UI", system-ui, sans-serif'; g2.fillText(ROLE[i],x,y); g2.globalAlpha=1;
    g2.letterSpacing='1px'; g2.font='400 21px Georgia, serif'; g2.fillText(set.names[i],x,y+24);
  }
  const blob=await new Promise(r=>out.toBlob(r,'image/png'));
  const res=await fetch('/save?name='+set.file,{method:'POST',body:blob});
  log(set.file+' → '+res.status);
}
(async()=>{ try{ const only=new URLSearchParams(location.search).get('set'); for(const s of SETS){ if(only&&s.key!==only) continue; await renderSet(s);} log('DONE'); }catch(e){ log('ERR '+e.stack); } })();
</script></body></html>
